name: Server API check

on:
  workflow_dispatch:
    inputs:
      service:
        description: API to verify
        required: true
        type: choice
        options: [gemini, finam, mistral, all]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTTP client
        run: python -m pip install --quiet requests

      - name: Check Gemini model access
        if: ${{ !cancelled() && (inputs.service == 'gemini' || inputs.service == 'all') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.check_server_apis gemini

      - name: Check read-only Finam quote
        if: ${{ !cancelled() && (inputs.service == 'finam' || inputs.service == 'all') }}
        env:
          FINAM_TRADE_API_KEY: ${{ secrets.FINAM_TRADE_API_KEY }}
        run: python -m scripts.check_server_apis finam

      - name: Check Mistral OCR on a public repository PDF
        if: ${{ !cancelled() && (inputs.service == 'mistral' || inputs.service == 'all') }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: >-
          python -m scripts.check_server_apis mistral
          --pdf results/ml_forecast_v5/fig_backtest_annual_returns.pdf --pages 0
