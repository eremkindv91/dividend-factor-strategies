name: ml-strategy-monthly (retrain + official model snapshot)

on:
  schedule:
    - cron: "45 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training runtime
        run: python -m pip install --quiet pandas pyarrow numpy scipy scikit-learn requests lxml ta lightgbm catboost
      - uses: actions/cache@v4
        with:
          path: |
            data/daily
            data/ml_strategy
          key: daily-ohlcv-${{ github.run_id }}
          restore-keys: |
            daily-ohlcv-
      - name: Full refresh, purged walk-forward and challenger review
        run: |
          python scripts/daily_ingest.py --years 8
          python scripts/build_ml_strategy.py --allow-network --challengers
          python scripts/validate_ml_strategy.py
          python scripts/validate_site_data.py ml_strategy
      - name: Publish official monthly model snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TMP"
          RESEARCH="$(mktemp -d)"
          for file in advanced_models.json advanced_challenger_evaluation.md; do
            if [ -f "$TMP/ml_strategy/$file" ]; then
              cp "$TMP/ml_strategy/$file" "$RESEARCH/$file"
            fi
          done
          rm -rf "$TMP/ml_strategy"
          mkdir -p "$TMP/ml_strategy"
          cp -R site/ml_strategy/. "$TMP/ml_strategy/"
          cp -R "$RESEARCH/." "$TMP/ml_strategy/"
          rm -rf "$RESEARCH"
          git -C "$TMP" add ml_strategy
          if [ -z "$(git -C "$TMP" diff --cached --name-only)" ]; then
            echo "[ml-strategy] no monthly changes"; rm -rf "$TMP"; exit 0
          fi
          git -C "$TMP" \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -q -m "deploy: ML strategy monthly model snapshot"
          git -C "$TMP" push origin gh-pages
          rm -rf "$TMP"
