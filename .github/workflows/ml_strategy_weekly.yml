name: ml-strategy-weekly (drift + challenger diagnostics)

on:
  schedule:
    - cron: "15 7 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install diagnostic runtime
        run: python -m pip install --quiet pandas pyarrow numpy scipy scikit-learn requests lxml lightgbm catboost
      - uses: actions/cache@v4
        with:
          path: |
            data/daily
            data/ml_strategy
          key: daily-ohlcv-${{ github.run_id }}
          restore-keys: |
            daily-ohlcv-
      - name: Refresh data and run champion/challenger diagnostics
        run: |
          python scripts/daily_ingest.py --years 8
          python scripts/build_ml_strategy.py --allow-network --challengers
          python scripts/validate_ml_strategy.py
      - uses: actions/upload-artifact@v4
        with:
          name: ml-strategy-weekly-diagnostics
          path: data/ml_strategy
          retention-days: 30
