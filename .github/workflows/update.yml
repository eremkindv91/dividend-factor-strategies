name: update (свежие цены + публикация в gh-pages)

# Cron-инференс на ГОТОВОМ артефакте: тянет свежие цены MOEX ISS, пересчитывает
# дивидендную доходность, собирает site/data.json и публикует сайт в ветку gh-pages
# (тот же механизм, что ручной scripts/deploy_ghpages.sh — Pages source остаётся gh-pages).
# НЕ обучает модель. Если артефакта нет или нет ни одной цены — build_data.py падает,
# публикации нет (на gh-pages остаётся последняя успешная версия сайта).
on:
  schedule:
    - cron: "0 6 * * 1-5"    # ~09:00 МСК, до открытия — подтягивает итоги вечерней сессии/предторга
    - cron: "0 16 * * 1-5"   # ~19:00 МСК, после закрытия основной сессии MOEX, по будням
  workflow_dispatch:

permissions:
  contents: write            # нужно для push в ветку gh-pages

concurrency:
  # общая группа со bonds_update.yml: сериализует все записи в gh-pages (orphan-push + additive bonds),
  # чтобы публикации не гонялись друг с другом. cancel-in-progress: false — не рвать push на полпути.
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей financial data layer
        run: |
          python -m pip install --quiet pandas pyarrow pyyaml requests ta openpyxl pytest
          python -m pip install --quiet t-tech-investments==1.49.2 \
            --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple

      - name: Резервное обновление новостей перед полным деплоем
        # Независимый второй триггер: если dedicated news cron задержан/пропущен,
        # основной daily update всё равно пытается собрать свежий дайджест.
        # Генератор пишет атомарно; при сбое остаётся last-good news.json.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          if python -m pip install --quiet -r news/requirements.txt; then
            python -m news.generate_news || echo "[news] резервная генерация не удалась — используем last-good"
          else
            echo "[news] зависимости недоступны — используем last-good"
          fi

      # кэш последних валидных цен между запусками (фолбэк при недоступности ISS)
      - uses: actions/cache@v4
        with:
          path: model_output/prices_cache.json
          key: prices-cache-${{ github.run_id }}
          restore-keys: |
            prices-cache-

      # кэш последнего валидного marketsaw.json: если MCFTR недоступен, build_marketsaw
      # не перезаписывает файл → публикуем предыдущий валидный (раздел 13 спеки «Пилы»)
      - uses: actions/cache@v4
        with:
          path: site/marketsaw.json
          key: marketsaw-${{ github.run_id }}
          restore-keys: |
            marketsaw-

      # кэш дивидендных дат MOEX: фолбэк для календаря событий при недоступности ISS
      - uses: actions/cache@v4
        with:
          path: |
            model_output/dividends_cache.json
            model_output/dividend_calendar_previous.json
            model_output/tinvest_dividends_cache.json
          key: dividends-cache-${{ github.run_id }}
          restore-keys: |
            dividends-cache-

      - name: Сборка unified financial layer и disclosure metadata loop
        # Fundamentals и disclosure metadata должны обновиться до RU Quality snapshot.
        run: |
          python -m src.pipeline.discover_companies
          python -m src.pipeline.fetch_reports --from-year 2024 --to-year 2026
          python -m src.pipeline.extract_financials --skip-ocr
          python -m src.pipeline.validate_financials
          python -m src.pipeline.migrate_existing_smartlab_data || echo "[migrate] пропуск — нет reconciled панели"
          python -m src.pipeline.unify_financial_data
          python -m src.pipeline.build_site_data

      - name: RU Quality — point-in-time metadata, Core score и schema gate
        # Если свежая сборка невозможна, builder использует только валидный tracked last-good
        # model_output/quality_rf.json и ставит stale=true; без валидного fallback job падает.
        run: python scripts/build_quality.py

      - name: Сборка data.json (инференс на артефакте + свежие цены MOEX ISS)
        run: python scripts/build_data.py   # exit!=0 (нет артефакта/нет цен) → публикации нет

      - name: RU Quality — обновить price/lot metadata после data.json
        run: python scripts/build_quality.py

      - name: Data-level очистка портфельных данных (сплиты, SNGS/SNGSP, аномалии рядов)
        # чистит data.json + returns.json В ИСТОЧНИКЕ: сплит-adjust дивидендов (T ÷10), добавляет
        # SNGS/SNGSP (no_model_coverage), помечает split-like ряды needs_adjustment. Сбой не блокирует.
        run: python scripts/clean_portfolio_data.py || echo "[clean] пропуск — данные без доп. очистки"

      - name: Сборка официального дивидендного календаря РФ
        env:
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          SSL_TBANK_VERIFY: "True"
        run: python scripts/build_dividend_calendar.py || echo "[div-calendar] live-сборка не удалась — predeploy восстановит last-good"

      - name: Сборка короткого events_calendar.json из общего dividend core
        run: python scripts/update_events_calendar.py || echo "[events] пропуск — календарь не пересобран"

      - name: Валидация обоих календарных контрактов
        run: |
          python scripts/validate_dividend_calendar.py || echo "[div-calendar] current невалиден — predeploy восстановит last-good"
          python scripts/validate_events_calendar.py || echo "[events] валидация короткого календаря не прошла"

      - name: Сборка marketsaw.json (фаза рынка по MCFTR, swing/zigzag)
        # сбой MCFTR НЕ должен блокировать дневной деплой цен; предыдущий валидный файл (кэш) остаётся
        run: |
          python market_saw/production/build_marketsaw.py || echo "[marketsaw] пропуск — сохранён предыдущий валидный файл (кэш)"

      - name: Сборка market_history.json (официальные графики MOEX ISS)
        # OHLC + SMA/RSI/волатильность для drill-down в «Текущем рынке».
        # Скрипт сохраняет last-good по каждому инструменту при частичном сбое ISS.
        run: python scripts/build_market_history.py || echo "[market-history] пропуск — сохранён предыдущий валидный файл"

      - name: Позиции физлиц во фьючерсах (MOEX ISS, весь equity universe)
        # Входит в основной daily pipeline: отдельный workflow оставлен только для ручной
        # диагностики. Сбор инкрементальный, а ошибка одной бумаги не останавливает batch.
        run: |
          python scripts/build_futures_positions.py --audit
          python scripts/build_positioning_interpretation.py || echo "[positioning] текст не обновлён — позиции уже сохранены"

      - name: Сборка marlamov.json (форвардная дивдоходность, 2 года + макро-режим)
        # читает site/data.json (создан шагом выше); сбой не блокирует деплой
        run: |
          python scripts/build_forward_yield.py || echo "[fwd] пропуск форвардной доходности"

      - name: P0 — клон текущего gh-pages (last-good для fallback и rollback)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_GOOD="$(mktemp -d)"
          if git clone --depth 1 --branch gh-pages \
               "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$LAST_GOOD" 2>/dev/null; then
            echo "LAST_GOOD=$LAST_GOOD" >> "$GITHUB_ENV"
            # IMOEX-контур «Пилы» генерит market-saw-update.yml (не этот job). Восстанавливаем его
            # файлы из last-good в site/ ДО сборки site_status — иначе блок marketsaw_imoex будет
            # «unavailable» и overall уедет в broken (файл-то на gh-pages есть, просто не локально).
            for f in marketsaw_imoex.json marketsaw_manifest.json marketsaw_mcftr.json market_pe_current.json market_pe_history.json; do
              [ -f "$LAST_GOOD/$f" ] && cp "$LAST_GOOD/$f" "site/$f" || true
            done
            # Кэш истории P/E: без него сборка делает ~325 медленных запросов к ISS (полная
            # история составов индекса и капитализаций). С кэшем дотягивается только хвост.
            mkdir -p data
            [ -f "$LAST_GOOD/market_pe_history_cache.json" ] && cp "$LAST_GOOD/market_pe_history_cache.json" data/ || true
          else
            echo "[last-good] gh-pages ещё нет (первый деплой) — fallback/rollback недоступны"
            rm -rf "$LAST_GOOD"
          fi

      - name: Локальные логотипы инструментов из T-Invest
        # Токен используется только во время сборки. В браузер и public artifact он не попадает.
        # При недоступности API публикация ниже сохраняет последний набор из gh-pages.
        env:
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
        run: |
          PREVIOUS=""
          if [ -n "$LAST_GOOD" ] && [ -f "$LAST_GOOD/instrument_logos.js" ]; then
            PREVIOUS="--previous-registry $LAST_GOOD/instrument_logos.js"
          fi
          python scripts/build_instrument_logos.py \
            --universe site/data.json \
            --output-dir "$RUNNER_TEMP/instrument-logos" \
            $PREVIOUS || echo "[instrument-logos] API недоступен — сохраняем last-good"

      - name: Сборка market_pe_current.json (P/E рынка по последней годовой прибыли)
        # base = свежайший опубликованный (восстановлен из LAST_GOOD выше). Скрипт при сбое ISS
        # держит last-good (is_stale), при покрытии <85% не обновляет. Сбой не блокирует деплой.
        run: python scripts/build_market_pe.py || echo "[market-pe] пропуск — сохранён предыдущий валидный файл (last-good)"

      - name: Сборка market_pe_history.json (P/E рынка в динамике)
        # Исторический состав индекса на каждую дату + point-in-time капитализация MOEX.
        # С восстановленным кэшем дотягивается только текущий месяц; без кэша (первый запуск)
        # строит всю историю и потому долгий. Сбой источника НЕ роняет деплой — остаётся last-good.
        run: python scripts/build_market_pe_history.py || echo "[market-pe-hist] пропуск — сохранён предыдущий валидный файл (last-good)"

      - name: Сборка macro_cbr.json (ключевая ставка + инфляция г/г от Банка России)
        # Источник — официальный ЦБ: SOAP KeyRate (дневная ставка) + таблица
        # «Инфляция и ключевая ставка». Сбой источника НЕ роняет деплой: скрипт выходит
        # с ненулевым кодом, прошлый валидный файл остаётся (last-good).
        run: python scripts/build_macro_cbr.py || echo "[macro] пропуск — сохранён предыдущий валидный файл (last-good)"

      - name: Сборка valuation_v2.json (оценка банков через остаточный доход)
        # Стоит ИМЕННО здесь, а не в update-cbr-banks.yml: модели нужны site_financials.json,
        # returns.json и marketsaw.json, а они в git не хранятся — их генерирует этот же
        # workflow выше. В банковском workflow их в checkout просто нет.
        # Сбой НЕ роняет деплой: остаётся закоммиченный last-good, как и у остальных блоков.
        run: python scripts/cbr_banks/build_banks_valuation_v2.py || echo "[banks-v2] пропуск — сохранён предыдущий валидный файл (last-good)"

      - name: Тесты модели остаточного дохода
        # Провал тестов не должен ронять деплой всего сайта из-за одного блока, но и
        # опубликовать модель с нарушенными инвариантами нельзя. Поэтому: откатываем
        # артефакт к закоммиченному last-good и продолжаем — как и с остальными блоками.
        run: |
          if ! python -m pytest -q tests/test_bank_residual_income.py; then
            echo "[banks-v2] ТЕСТЫ НЕ ПРОШЛИ — возвращаем предыдущий валидный valuation_v2.json"
            git checkout -- site/cbr/valuation_v2.json || true
          fi

      - name: P0 — жёсткий pre-deploy контракт + last-good fallback
        # пустой/битый обязательный блок (data.json/marketsaw) НЕ должен попасть на сайт.
        # если битьё — подставляем last-good и помечаем fallback; если и это не спасло — exit≠0 → нет публикации.
        run: |
          if ! python scripts/check_predeploy_contract.py; then
            echo "[gate] обязательный блок битый → пробую last-good fallback"
            if [ -n "$LAST_GOOD" ]; then python scripts/restore_last_good_site_data.py --last-good "$LAST_GOOD"; fi
            python scripts/check_predeploy_contract.py   # повтор: битьё после fallback → job fail, gh-pages остаётся last-good
          fi

      - name: Не затирать более свежие новости полным деплоем
        # news.yml публикует аддитивно и может быть свежее checkout source branch.
        # Берём newest valid по generated_at между локальным и текущим gh-pages.
        run: |
          PUBLISHED=""
          if [ -n "$LAST_GOOD" ] && [ -f "$LAST_GOOD/news.json" ]; then PUBLISHED="$LAST_GOOD/news.json"; fi
          python scripts/preserve_freshest_news.py site/news.json "$PUBLISHED"

      - name: P0 — site_status.json (Data Health — свежесть блоков)
        run: python scripts/build_site_status.py

      - name: Валидация контрактов JSON перед публикацией
        # критическая ошибка контракта → exit 1 → шаг публикации НЕ выполнится (не публикуем битое)
        run: python scripts/validate_site_data.py

      - name: Публикация site/ → gh-pages (orphan, как scripts/deploy_ghpages.sh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP="$(mktemp -d)"
          cp site/index.html site/styles.css site/instrument_logos.js site/instrument_identity.js site/bond_allocator.js site/bond_retail.js site/app.js site/data.json "$TMP/"
          [ -d site/assets ] && cp -r site/assets "$TMP/"
          [ -f site/methodology.json ] && cp site/methodology.json "$TMP/"   # методология (4 раздела, в репо)
          [ -f site/returns.json ] && cp site/returns.json "$TMP/"   # ряд для риск-метрик конструктора
          [ -f site/marketsaw.json ] && cp site/marketsaw.json "$TMP/"   # фаза рынка (Помощник фазы)
          [ -f site/market_history.json ] && cp site/market_history.json "$TMP/"   # графики и техуровни MOEX ISS
          [ -f site/marlamov.json ] && cp site/marlamov.json "$TMP/"   # форвардная дивдоходность (Марламов)
          [ -f site/quality.json ] && cp site/quality.json "$TMP/"   # RU Quality Core + provenance
          [ -f site/site_coverage.json ] && cp site/site_coverage.json "$TMP/"   # покрытие и качество фундаментальных данных
          [ -f site/site_financials.json ] && cp site/site_financials.json "$TMP/"   # additive unified financial layer
          [ -f site/news.json ] && cp site/news.json "$TMP/"   # утренний новостной блок рынка РФ
          [ -f site/alfa-index.json ] && cp site/alfa-index.json "$TMP/"   # внешний индикатор настроения рынка
          [ -f site/alfa-index-history.json ] && cp site/alfa-index-history.json "$TMP/"   # история индикатора
          [ -f site/dividend_calendar.json ] && cp site/dividend_calendar.json "$TMP/"   # официальный дивидендный календарь
          [ -f site/events_calendar.json ] && cp site/events_calendar.json "$TMP/"   # «Сегодня важные события»
          [ -f site/market_pe_current.json ] && cp site/market_pe_current.json "$TMP/"   # P/E рынка по последней годовой прибыли
          [ -f site/market_pe_history.json ] && cp site/market_pe_history.json "$TMP/"   # P/E рынка в динамике (месячный ряд)
          # Кэш истории публикуем, чтобы следующий запуск CI поднял его из last-good и не
          # перекачивал 14 лет данных заново. Сайтом не загружается — это артефакт сборки.
          [ -f data/market_pe_history_cache.json ] && cp data/market_pe_history_cache.json "$TMP/"
          [ -f site/macro_cbr.json ] && cp site/macro_cbr.json "$TMP/"   # макро ЦБ: ключевая ставка + инфляция
          # Генерируется update-futures-positions.yml и коммитится в репо, поэтому здесь просто копируется:
          # без этой строки orphan-push стирал бы позиции физлиц с gh-pages при каждом прогоне.
          [ -f site/futures_positions.json ] && cp site/futures_positions.json "$TMP/"
          # Разбор позиционирования — тот же случай: генерируется соседним workflow.
          [ -f site/market_positioning_commentary.json ] && cp site/market_positioning_commentary.json "$TMP/"
          [ -f site/site_status.json ] && cp site/site_status.json "$TMP/"   # P0: Data Health (свежесть блоков)
          [ -f site/_fallback.json ] && cp site/_fallback.json "$TMP/"   # P0: маркер last-good fallback
          [ -d site/bonds ] && mkdir -p "$TMP/bonds" && cp site/bonds/*.json "$TMP/bonds/"   # скринер облигаций
          [ -d site/cbr ] && mkdir -p "$TMP/cbr" && cp site/cbr/*.json "$TMP/cbr/"   # данные банков ЦБ РФ (формы 102/123/135)
          # Daily Market Data Foundation: этот job их не генерирует (отдельный workflow
          # daily_market_data.yml, additive-publish) — orphan-republish иначе стирал бы их с
          # gh-pages при каждом ручном/сezonном запуске update.yml. Переносим из LAST_GOOD (уже
          # склонирован для P0-fallback выше), если есть.
          if [ -n "$LAST_GOOD" ]; then
            [ -f "$LAST_GOOD/instrument_logos.js" ] && cp "$LAST_GOOD/instrument_logos.js" "$TMP/"
            if [ -d "$LAST_GOOD/assets/instruments/companies" ]; then
              mkdir -p "$TMP/assets/instruments"
              cp -R "$LAST_GOOD/assets/instruments/companies" "$TMP/assets/instruments/"
            fi
            [ -f "$LAST_GOOD/daily_market_data_quality.json" ] && cp "$LAST_GOOD/daily_market_data_quality.json" "$TMP/"
            [ -d "$LAST_GOOD/daily/web" ] && mkdir -p "$TMP/daily/web" && cp "$LAST_GOOD"/daily/web/*.json "$TMP/daily/web/" 2>/dev/null || true
            # ML strategy is produced by dedicated daily/weekly/monthly jobs. Preserve the
            # newest validated additive snapshot during this unrelated orphan republish.
            [ -d "$LAST_GOOD/ml_strategy" ] && mkdir -p "$TMP/ml_strategy" && cp -R "$LAST_GOOD/ml_strategy/." "$TMP/ml_strategy/"
            # Скринер облигаций генерит bonds_update.yml (свой cron + additive-push в gh-pages).
            # Этот job его НЕ считает и копирует выше закоммиченную в репозиторий копию, которая
            # отстаёт: бот коммитит не при каждом успешном прогоне. Из-за этого orphan-republish
            # откатывал облигации на gh-pages к более старым ценам, и safe-фильтр честно отсеивал
            # весь универсум как устаревший. Оставляем то, что новее по дате цены.
            if [ -f "$LAST_GOOD/bonds/universe.json" ] \
               && python scripts/pick_fresher_bonds.py "$LAST_GOOD/bonds/universe.json" "$TMP/bonds/universe.json"; then
              echo "[bonds] на gh-pages данные свежее чекаута — сохраняем опубликованные"
              mkdir -p "$TMP/bonds" && cp "$LAST_GOOD"/bonds/*.json "$TMP/bonds/"
            fi
            # Двухконтурная «Пила»: marketsaw_imoex/manifest/mcftr генерит market-saw-update.yml
            # (отдельный additive-publish). marketsaw.json (MCFTR) этот job строит сам (выше);
            # для остальных — перенос из LAST_GOOD, иначе orphan-republish их сотрёт.
            for f in marketsaw_imoex.json marketsaw_manifest.json marketsaw_mcftr.json; do
              [ -f "$LAST_GOOD/$f" ] && cp "$LAST_GOOD/$f" "$TMP/" || true
            done
          fi
          # Свежий валидный набор имеет приоритет над last-good. Генератор пишет его
          # атомарно и только если получил хотя бы один корректный PNG.
          if [ -f "$RUNNER_TEMP/instrument-logos/instrument_logos.js" ]; then
            cp "$RUNNER_TEMP/instrument-logos/instrument_logos.js" "$TMP/"
            mkdir -p "$TMP/assets/instruments"
            cp -R "$RUNNER_TEMP/instrument-logos/assets/instruments/companies" "$TMP/assets/instruments/"
            cp "$RUNNER_TEMP/instrument-logos/assets/instruments/company_manifest.json" "$TMP/assets/instruments/"
          fi
          # cache-bust: версионируем JS/CSS по SHA коммита → браузер тянет согласованный frontend
          # под свежий index.html (иначе CDN/браузер кэшируют их вразнобой → рассинхрон логики)
          V="${GITHUB_SHA:0:8}"
          sed -i "s|\"instrument_logos\.js\"|\"instrument_logos.js?v=${V}\"|g; s|\"instrument_identity\.js\"|\"instrument_identity.js?v=${V}\"|g; s|\"bond_allocator\.js\"|\"bond_allocator.js?v=${V}\"|g; s|\"bond_retail\.js\"|\"bond_retail.js?v=${V}\"|g; s|\"app\.js\"|\"app.js?v=${V}\"|g; s|\"styles\.css\"|\"styles.css?v=${V}\"|g" "$TMP/index.html"
          printf '{"version":"%s","generated":"%s"}\n' "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$TMP/build.json"   # §6.1: манифест кэша данных (dataURL ?v=)
          touch "$TMP/.nojekyll"
          git -C "$TMP" init -q
          git -C "$TMP" checkout -q -b gh-pages
          git -C "$TMP" add -A
          git -C "$TMP" \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -q -m "deploy: автообновление цен (cron)"
          git -C "$TMP" push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf "$TMP"

      - name: P0 — public smoke-test (+ rollback к last-good при критичном битье)
        # проверяет, что ЖИВОЙ сайт отдаёт непустые index/data/marketsaw. Критичное битьё → откат.
        # site_status/лаг CDN не откатывают (--core-only); стойкость к лагу — ретраи внутри скрипта.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30   # дать Pages CDN стартовать сборку
          if python scripts/smoke_public_site.py --core-only --retries 10; then
            python scripts/smoke_public_site.py --retries 3 || echo "[smoke] site_status ещё не пропагировался (не критично)"
            echo "[smoke] публичный сайт OK"
          else
            echo "[smoke] КРИТИЧНОЕ битьё живого сайта → ROLLBACK к last-good"
            if [ -n "$LAST_GOOD" ] && [ -d "$LAST_GOOD/.git" ]; then
              git -C "$LAST_GOOD" push -f \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
              echo "[rollback] gh-pages возвращён к предыдущей рабочей версии"
            else
              echo "[rollback] last-good недоступен — ручное вмешательство"
            fi
            exit 1
          fi
