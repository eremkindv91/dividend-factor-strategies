name: bonds update (скринер облигаций РФ, квантовый расчёт)

# Считает скринер облигаций по реальному ISS MOEX (G-кривая + дисконт потоков + linprog-портфели)
# и кладёт результат в site/bonds/*.json. Публикует на сайт существующий update.yml (единый
# паблишер gh-pages — он копирует site/bonds в orphan-push). Тяжёлые зависимости (pandas/numpy/
# scipy) — только тут, в дневной stdlib-публикации их нет.
on:
  schedule:
    - cron: "50 20 * * *"     # ежедневно 20:50 UTC (после закрытия вечерней сессии MOEX)
  workflow_dispatch:

permissions:
  contents: write             # бот коммитит site/bonds/*.json обратно в ветку

concurrency:
  group: bonds-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: python -m pip install --quiet requests pandas numpy scipy

      - name: Квантовый расчёт скринера (реальный ISS MOEX)
        run: python bonds/update_bonds.py     # exit!=0 (пустой результат/ISS недоступен) → коммита нет

      - name: Коммит site/bonds/*.json в ветку
        run: |
          if [ -z "$(git status --porcelain site/bonds)" ]; then
            echo "нет изменений в site/bonds — пропуск коммита"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/bonds/*.json
          git commit -m "data(bonds): автообновление скринера облигаций (cron)"
          git push
