name: bonds update (скринер облигаций РФ, квантовый расчёт)

# Считает скринер облигаций по реальному ISS MOEX (G-кривая + cash-flow YTM/duration + MILP-портфели)
# и кладёт результат в site/bonds/*.json. Коммитит их в ветку И additive-публикует ТОЛЬКО bonds/
# в gh-pages (не трогая остальной сайт) — чтобы свежие облигации были на сайте сразу, не дожидаясь
# дневного update.yml. update.yml тоже включает bonds в orphan-push (двойная гарантия, согласованно,
# т.к. bonds коммитятся). Тяжёлые зависимости (pandas/numpy/scipy) — только тут.
on:
  schedule:
    - cron: "50 20 * * *"     # ежедневно 20:50 UTC (после закрытия вечерней сессии MOEX)
  workflow_dispatch:

permissions:
  contents: write             # бот коммитит site/bonds/*.json и пушит bonds/ в gh-pages

concurrency:
  # общая группа с update.yml: сериализует записи в gh-pages (orphan-push vs additive bonds) → без гонок
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: python -m pip install --quiet requests pandas numpy scipy openpyxl pypdf pytest

      - uses: actions/cache@v4
        with:
          path: data/bond_finder/official_ratings_cache.json
          key: official-bond-ratings-${{ github.run_id }}
          restore-keys: |
            official-bond-ratings-

      - name: Квантовый расчёт скринера (реальный ISS MOEX)
        run: python bonds/update_bonds.py     # exit!=0 (пустой результат/ISS недоступен) → коммита нет

      - name: Bond Finder (месячный шорт-лист кандидатов)
        # переиспользует данные ISS; при сбое скринер уже собран — не блокируем, но фиксируем
        run: |
          python bonds/bond_finder.py || echo "[finder] пропуск — предыдущий finder.json остаётся"

      - name: Валидация bonds-контрактов
        # критическая ошибка → exit 1 → коммита и публикации НЕ будет (не публикуем битое)
        run: python scripts/validate_site_data.py bonds

      - name: Тесты Bond Portfolio Lab
        run: pytest -q tests/bonds/test_bond_portfolio_lab_v3.py tests/bonds/test_bond_analytics_v4.py tests/test_bond_portfolio_lab_ui.py tests/test_bond_analytics_v4_ui.py

      - name: Коммит site/bonds/*.json в ветку
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- site/bonds/*.json site/bonds/details/*.json bonds/issuer_master.json
          # official_ratings_cache.json намеренно ignored: в commit идут только
          # tracked или новые неигнорируемые state-файлы Bond Finder.
          git ls-files -co --exclude-standard -- 'data/bond_finder/*.json' \
            | xargs -r git add --
          if git diff --cached --quiet; then
            echo "нет содержательных изменений в bonds — пропуск коммита"; exit 0
          fi
          git diff --cached --check
          git commit -m "data(bonds): автообновление скринера облигаций (cron)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Публикация bonds → gh-pages (additive, не трогая остальной сайт)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP="$(mktemp -d)"
          if ! git clone --depth 1 --branch gh-pages \
               "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TMP" 2>/dev/null; then
            echo "[bonds] gh-pages ещё нет — additive-publish пропущен (опубликует update.yml)"; exit 0
          fi
          rm -rf "$TMP/bonds"
          mkdir -p "$TMP/bonds"
          cp site/bonds/*.json "$TMP/bonds/"
          [ -d site/bonds/details ] && cp -R site/bonds/details "$TMP/bonds/details"
          git -C "$TMP" add bonds
          if git -C "$TMP" diff --cached --quiet; then
            echo "[bonds] на gh-pages без изменений"; rm -rf "$TMP"; exit 0
          fi
          git -C "$TMP" \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -q -m "publish(bonds): additive обновление скринера облигаций"
          git -C "$TMP" push origin gh-pages
          rm -rf "$TMP"
