name: news (брифинг рынка РФ)

# ВРЕМЯ ПРОГОНОВ — ОБЪЯСНЕНИЕ (замер 10–29.07.2026, 40 прогонов).
# GitHub НЕ запускает schedule точно в срок: очередь на общих раннерах даёт задержку
# +1.4…+2.6 ч в среднем (до +3.4 ч в пике), и она тем больше, чем «круглее» минута
# (:00 и :20 — самые загруженные слоты у всех репозиториев планеты).
# Факт по старому расписанию:
#     план 07:00 МСК → факт 09:26   план 09:20 → факт 11:54   план 19:00 → факт 20:23
# То есть «предторговый контроль» приезжал через ~2 ч ПОСЛЕ открытия торгов (10:00),
# и инвестор к началу сессии не имел свежей сводки — ровно та жалоба, что чиним.
#
# Отсюда два правила расписания:
#   1) ставим НЕкруглые минуты (:13/:23/:37/:47) — очередь заметно короче;
#   2) ставим с ЗАПАСОМ на 2–3 ч раньше нужного времени, а не «когда надо».
# Прогоны идемпотентны (news.json просто перезаписывается свежим), поэтому две
# утренние попытки — это подстраховка, а не дубль: если первая упадёт на Gemini 503,
# вторая всё равно успеет до открытия.
on:
  schedule:
    - cron: "37 2 * * 1-5"   # 05:37 МСК → факт ~07:00–09:00: ОСНОВНАЯ сводка до открытия
    - cron: "47 4 * * 1-5"   # 07:47 МСК → факт ~09:10–11:10: подстраховка, если первая не прошла
    - cron: "13 15 * * 1-5"  # 18:13 МСК → факт ~19:30–21:00: итоги торгового дня
    - cron: "23 7 * * 6"     # 10:23 МСК сб → обзор недели: раньше выходные были дырой 61–62 ч
    - cron: "23 14 * * 0"    # 17:23 МСК вс → «к новой неделе»: повестка понедельника
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Общая группа с основными деплоями: все записи в gh-pages идут последовательно.
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей news pipeline
        run: python -m pip install --quiet -r news/requirements.txt

      - name: Генерация site/news.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -m news.generate_news

      - name: Валидация news.json
        run: |
          test -f site/news.json
          python scripts/validate_site_data.py news

      - name: Commit site/news.json в source branch
        run: |
          if [ -z "$(git status --porcelain -- site/news.json)" ]; then
            echo "[news] site/news.json без изменений"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/news.json
          git commit -m "data(news): автообновление брифинга рынка"
          # Гонка с другими воркфлоу (update.yml/bonds/dividends тоже коммитят в ветку)
          # роняла прогон: «failed to push some refs». Ретрай с rebase — news.json
          # трогает только этот пайплайн, поэтому конфликта содержимого не бывает.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "[news] push ок с попытки $attempt"
              exit 0
            fi
            echo "[news] push отклонён (попытка $attempt) — подтягиваю и повторяю"
            sleep $(( attempt * 5 ))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "[news] push не удался после 5 попыток" >&2
          exit 1

      - name: Additive publish news.json → gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP="$(mktemp -d)"
          git clone --quiet --branch gh-pages --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TMP"
          cp site/news.json "$TMP/news.json"
          touch "$TMP/.nojekyll"
          # site_status.json строится реже (update.yml) → без патча свежие новости показывались бы
          # как stale. Пересчитываем ТОЛЬКО news-блок по фактическому news.json (idемпотентно).
          python scripts/patch_news_status.py "$TMP" || echo "[news] патч site_status пропущен"
          if [ -z "$(git -C "$TMP" status --porcelain -- news.json site_status.json .nojekyll)" ]; then
            echo "[news] gh-pages/news.json без изменений"
            rm -rf "$TMP"
            exit 0
          fi
          git -C "$TMP" config user.name "github-actions[bot]"
          git -C "$TMP" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$TMP" add news.json .nojekyll
          [ -f "$TMP/site_status.json" ] && git -C "$TMP" add site_status.json
          git -C "$TMP" commit -m "deploy(news): обновление утреннего блока"
          git -C "$TMP" push origin gh-pages
          rm -rf "$TMP"
