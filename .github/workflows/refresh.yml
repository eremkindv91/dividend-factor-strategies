name: refresh (квартал — панель SmartLab + переобучение)

# АВТОНОМНЫЙ квартальный конвейер: дозаполняет панель из SmartLab (с гейтами),
# ПЕРЕОБУЧАЕТ прогноз на свежей панели (build_artifact --live, с сан-гейтами) и коммитит
# артефакт + панель. Публикацию подхватит ближайший cron update.yml (свежий forecast_rf.json).
# Fail-safe: любой упавший шаг или сработавший сан-гейт прерывает job → коммита нет →
# на сайте остаётся прошлый прогноз. SmartLab без API: при блокировке облачного IP часть
# тикеров не достанется (логируется, не фатально) — панель просто меньше дозаполнится.
# РАСПИСАНИЕ ПЕРЕСМОТРЕНО 29.07.2026. Было: только квартал (5-го мар/июн/сен/дек).
# По факту это означало, что прогноз мог стоять до 3 месяцев: на 29.07 в проде висел
# forecast_asof=2026-06-19 (40 дней) и valuation_asof=2026-06-26 (33 дня), при том что
# сам workflow за всё время ни разу не отработал автоматически — единственный ручной
# прогон 19.06 был отменён. То есть «квартальное обновление» существовало на бумаге.
#
# Что изменено и почему:
#   • ЕЖЕМЕСЯЧНО вместо квартала. Панель фундаментала дозаполняется непрерывно
#     (quality_as_of обновляется ежедневно), отчётности приходят весь год, а оценка
#     DCF зависит от цены — держать всё это замороженным на квартал нет причин.
#     Месячный шаг оставляет прогноз годового дивиденда методологически честным
#     (он строится на ГОДОВОЙ отчётности), но не даёт ему протухать на 3 месяца.
#   • НЕкруглая минута: очередь GitHub на :00 даёт задержку до 2,6 ч (замер по news.yml).
#   • 3-е число: после закрытия месяца, до основных публикаций отчётности.
on:
  schedule:
    - cron: "43 1 3 * *"   # 04:43 МСК 3-го числа каждого месяца
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей (ML-стек)
        run: pip install -r requirements.txt

      - name: Дозаполнение панели из SmartLab (гейты валюта/перехлёст/только пустые)
        run: |
          python scripts/smartlab_reconcile.py ALL
          # reconcile пишет в *_smartlab.csv (только дозаполнения, ручное не трогает) → применяем
          cp data/panels_final/panel_russia_final_smartlab.csv data/panels_final/panel_russia_final.csv

      - name: Переобучение прогноза на свежей панели (live)
        run: python scripts/build_artifact.py --live   # сан-гейты внутри → падает на мусоре, деплоя нет

      - name: Оценка справедливой стоимости (роутер DCF/DDM/мультипликаторы) + история
        run: python scripts/build_valuations.py        # дополняет forecast_rf.json блоками valuation+history

      - name: RU Quality Core (детерминированный cross-section)
        run: python scripts/build_quality.py

      - name: Коммит панели + артефакта (если изменилось)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/panels_final/panel_russia_final.csv model_output/forecast_rf.json model_output/quality_rf.json results/smartlab/reconcile.csv
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
            exit 0
          fi
          git commit -m "refresh: ежемесячное обновление панели (SmartLab) + переобучение прогноза (live)"
          # Ретрай с rebase: в ветку параллельно коммитят update/news/bonds/dividends,
          # и обычный push отваливался с «failed to push some refs», теряя переобучение.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "[refresh] push ок с попытки $attempt"
              exit 0
            fi
            echo "[refresh] push отклонён (попытка $attempt) — подтягиваю и повторяю"
            sleep $(( attempt * 5 ))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "[refresh] push не удался после 5 попыток" >&2
          exit 1

      - name: Публикация обновлённого прогноза на сайт
        # Раньше свежий артефакт ЖДАЛ ближайшего cron update.yml — то есть до полусуток
        # сайт показывал старый прогноз, хотя новый уже лежал в ветке. Дёргаем публикацию
        # сразу. Сбой здесь не критичен: ближайший плановый прогон всё равно опубликует.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update.yml --ref "${GITHUB_REF_NAME}" \
            && echo "[refresh] публикация запущена" \
            || echo "[refresh] не удалось дёрнуть update.yml — опубликует ближайший плановый прогон"
