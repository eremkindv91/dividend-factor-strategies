  aliases_en:
    - Total assets
  sign_convention: positive
  unit: currency
  priority: 1
  formula_if_calculated: null
total_equity:
  canonical_name: total_equity
  statement_type: balance_sheet
  aliases_ru:
    - Капитал
    - Итого капитал
  aliases_en:
    - Total equity
  sign_convention: as_reported
  unit: currency
  priority: 1
  formula_if_calculated: null
operating_cash_flow:
  canonical_name: operating_cash_flow
  statement_type: cash_flow
  aliases_ru:
    - Операционный денежный поток
    - Денежные средства от операционной деятельности
